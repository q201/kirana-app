name: Deploy Mohalla Kirana App & Supabase Edge Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1. Deploy Frontend Web Application to GitHub Pages
  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Deploy Supabase Edge Functions
  deploy-supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Database Migrations & Edge Functions to Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Deploying Supabase Edge Functions..."
            supabase functions deploy process-order --project-ref txufqadysiifuwvejmxu --no-verify-jwt
            supabase functions deploy parse-voice-order --project-ref txufqadysiifuwvejmxu --no-verify-jwt
            
            if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              echo "Applying Supabase Database Migrations..."
              supabase db push --project-ref txufqadysiifuwvejmxu --password "$SUPABASE_DB_PASSWORD" || true
            fi
          else
            echo "SUPABASE_ACCESS_TOKEN secret not set. Skipping Supabase Edge Functions & DB migration deployment."
          fi
